<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="400" height="240" fill="#ffffff"/>
  <g fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round">
    <!-- top wire with two series resistors -->
    <line x1="60" y1="60" x2="118" y2="60"/>
    <line x1="162" y1="60" x2="238" y2="60"/>
    <line x1="282" y1="60" x2="340" y2="60"/>
    <!-- bottom wire -->
    <line x1="60" y1="180" x2="340" y2="180"/>
    <!-- left wire (with battery gap) -->
    <line x1="60" y1="60" x2="60" y2="112"/>
    <line x1="60" y1="128" x2="60" y2="180"/>
    <!-- right wire (with capacitor gap) -->
    <line x1="340" y1="60" x2="340" y2="112"/>
    <line x1="340" y1="128" x2="340" y2="180"/>
  </g>

  <!-- R1 -->
  <g id="R1">
    <rect x="118" y="50" width="44" height="20" rx="2" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="140" y="42" text-anchor="middle" font-size="14" fill="#111827">R1</text>
  </g>

  <!-- R2 -->
  <g id="R2">
    <rect x="238" y="50" width="44" height="20" rx="2" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="260" y="42" text-anchor="middle" font-size="14" fill="#111827">R2</text>
  </g>

  <!-- Battery (left) -->
  <g id="BAT" fill="none" stroke="#111827">
    <line x1="42" y1="112" x2="78" y2="112" stroke-width="2"/>
    <line x1="52" y1="128" x2="68" y2="128" stroke-width="5"/>
    <text x="26" y="124" text-anchor="middle" font-size="14" fill="#111827" stroke="none">V</text>
  </g>

  <!-- Capacitor (right) -->
  <g id="C1" fill="none" stroke="#111827" stroke-width="2">
    <line x1="318" y1="112" x2="362" y2="112"/>
    <line x1="318" y1="128" x2="362" y2="128"/>
    <text x="376" y="124" text-anchor="middle" font-size="14" fill="#111827" stroke="none">C1</text>
  </g>
</svg>
